        // --- SUB-KOMPONEN: MODE KAMERA AR DENGAN REAL AI GEMINI ---

            const [errorMessage, setErrorMessage] = useState("");

            useEffect(() => {
                let currentStream = null;
                const startCam = async () => {
                    try {
                        currentStream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: 'environment' } 
                        });
                        if (videoRef.current) {
                            videoRef.current.srcObject = currentStream;
                        }
                    } catch (err) {
                        console.error("Camera access error:", err);
                        setErrorMessage("Kamera tidak dapat diakses. Pastikan kamu membuka lewat jaringan HTTPS aman (seperti GitHub Pages) dan mengizinkan hak akses kamera.");
                        setScanState('ERROR');
                    }
                };
                startCam();
                return () => {
                    if (currentStream) {
                        currentStream.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const analyzeImageWithGemini = async (base64Data) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                
                const promptText = `Analyze this image of a product packaging. Identify the main packaging material and its target end-of-life waste classification based on these 5 categories:
                1. ORGANIK: Pure natural organic material like leaves, unvarnished wood, bamboo, natural plant-based sponges.
                2. KERTAS: Pure unlaminated paper or cardboard, molded pulp. No plastic film, glossy laminates, or foils.
                3. ANORGANIK: Clean, highly recyclable materials like clear PET bottles, HDPE jugs, unpainted glass jars, aluminium cans, or pure single-type monomaterial plastics.
                4. B3: Hazardous, flammable, or toxic chemical waste, compressed aerosol canisters, hairspray, acetone/alcohol bottles, chemical hair dye tubes.
                5. RESIDU: Multi-layer packaging, flexible laminate pouches, metallized film sachets, plastic glossy laminated boxes, bioplastics (like PLA which require industrial composting), composite materials.

                Provide a JSON response containing the detected object details. For the 'explanation' field: If the object has multiple materials (e.g., plastic bottle + sticker label + aluminum cap + leftover liquid), DETAIL how to separate them! Tell the user exactly which bin each specific part goes to. Use Indonesian. Keep the tone simple, to-the-point, with a natural Gen-Z vibe (casual, engaging, not cringe). Make it structured but concise enough for mobile reading.`;

                const payload = {
                    contents: [{
                        parts: [
                            { text: promptText },
                            {
                                inlineData: {
                                    mimeType: "image/jpeg",
                                    data: base64Data
                                }
                            }
                        ]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                title: { type: "STRING" },
                                description: { type: "STRING" },
                                correctAnswer: { type: "STRING", enum: ["ORGANIK", "KERTAS", "ANORGANIK", "B3", "RESIDU"] },
                                explanation: { type: "STRING" }
                            },
                            required: ["title", "description", "correctAnswer", "explanation"]
                        }
                    }
                };

                const fetchWithRetry = async (url, options, retries = 5, delay = 1000) => {
                    try {
                        const response = await fetch(url, options);
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        return await response.json();
                    } catch (error) {
                        if (retries === 1) throw error;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return fetchWithRetry(url, options, retries - 1, delay * 2);
                    }
                };

                try {
                    const result = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const responseText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!responseText) throw new Error("Respons AI kosong.");
                    
                    const parsedData = JSON.parse(responseText);
                    setAiResult(parsedData);
                    setScanState('RESULT');
                } catch (err) {
                    console.error("Gemini API Error:", err);
                    setErrorMessage("Gagal menganalisis gambar. Pastikan kemasan terlihat jelas dan koneksi internet aktif.");
                    setScanState('ERROR');

            };

            const takePicture = () => {

                    const dataUrl = canvasRef.current.toDataURL('image/jpeg', 0.8);
                    setCapturedImg(dataUrl);
                    setScanState('SCANNING');

                    const base64Data = dataUrl.split(',')[1];
                    analyzeImageWithGemini(base64Data);
                }
            };

            const resetScanner = () => {
                setScanState('IDLE');
                setCapturedImg(null);
                setAiResult(null);
                setErrorMessage("");

            return (
                <div className="flex flex-col items-center w-full max-w-2xl mx-auto h-full">

                        {(scanState === 'SCANNING' || scanState === 'RESULT' || scanState === 'ERROR') && capturedImg && (

                        {/* Garis Sensor Laser Animasi */}
                        {scanState === 'SCANNING' && (
                            <div className="absolute inset-0 pointer-events-none">

                                <div className="absolute inset-0 bg-indigo-900/40 flex items-center justify-center">

                        {/* Error Handling Layer */}
                        {scanState === 'ERROR' && (

                            </div>
                        )}

                        <canvas ref={canvasRef} className="hidden"></canvas>
                    </div>

                    <div className="mt-6 w-full">
                        {scanState === 'IDLE' && (
                            <div className="flex flex-col gap-4">
                                <div className="bg-blue-50 border border-blue-200 text-blue-800 px-5 py-4 rounded-xl text-sm font-medium flex items-start gap-3 shadow-sm">
                                    <span className="text-2xl leading-none">💡</span>
                                    <p><strong>Tips Scan:</strong> Gunakan latar belakang yang polos (seperti meja putih) dan pastikan kemasan terang serta fokus agar tebakan AI lebih akurat!</p>
                                </div>
                                <button onClick={takePicture} className="w-full py-5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-2xl rounded-2xl shadow-[0_8px_0_rgb(67,56,202)] hover:shadow-[0_4px_0_rgb(67,56,202)] hover:translate-y-1 transition-all flex justify-center items-center gap-3">
                                    📸 <span>Pindai Sekarang</span>
                                </button>
                            </div>
                        )}

                        {scanState === 'RESULT' && aiResult && (
                            <div className="bg-white border-4 border-slate-200 p-6 sm:p-8 rounded-[2rem] shadow-2xl w-full text-left animate-in slide-in-from-bottom-8">
                                <span className="text-xs font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full uppercase tracking-wider">Identifikasi Sukses</span>
                                <h3 className="text-3xl font-black text-slate-800 mt-2 mb-1">{aiResult.title}</h3>

                                <div className="bg-emerald-50 border-2 border-emerald-200 p-5 rounded-2xl flex items-center gap-5 mb-6">
                                    <div className="text-5xl">{BINS.find(b => b.id === aiResult.correctAnswer).icon}</div>

                                <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 mb-6">

        // --- MAIN APP COMPONENT ---
        function App() {
            const [gameState, setGameState] = useState('START'); 
            const [activeSessionLevels, setActiveSessionLevels] = useState(() => {
                return LEVEL_DATA.map(levelObj => ({
                    ...levelObj,
                    questions: shuffleArray(levelObj.bank).slice(0, 5) // Mengambil 5 pertanyaan acak per level
                }));
            });
            const [score, setScore] = useState(0);
            const [levelScore, setLevelScore] = useState(0); 
            const [currentLevelIndex, setCurrentLevelIndex] = useState(0);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [lastUserAnswer, setLastUserAnswer] = useState(null);
            const [lastAnswerStatus, setLastAnswerStatus] = useState(null);
            const [animatingItem, setAnimatingItem] = useState(false);
            
            // Drag and Drop States
            const [isDragging, setIsDragging] = useState(false);
            const [dragOverBinId, setDragOverBinId] = useState(null);
            
            // Leaderboard Submit States
            const [playerName, setPlayerName] = useState('');
            const [playerProfession, setPlayerProfession] = useState('Desainer / Mahasiswa'); // Default value
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null);

            const prepareGame = () => {
                setGameState('RULES');
            };

            const startGame = () => {
                const randomizedLevels = LEVEL_DATA.map(levelObj => {
                    const shuffledQuestions = shuffleArray(levelObj.bank).slice(0, 5);
                    return { ...levelObj, questions: shuffledQuestions };
                });
                setActiveSessionLevels(randomizedLevels);
                setScore(0);
                setLevelScore(0);
                setCurrentLevelIndex(0);
                setCurrentQuestionIndex(0);
                setSubmitStatus(null);
                setPlayerName('');
                setGameState('PLAYING');
            };

            const backToStart = () => {
                setGameState('START');
            };

            const currentLevel = activeSessionLevels[currentLevelIndex] || LEVEL_DATA[0];
            const currentQuestion = currentLevel?.questions?.[currentQuestionIndex] || LEVEL_DATA[0].bank[0];

            // --- DRAG AND DROP HANDLERS ---
            const handleDragStart = (e) => {
                setIsDragging(true);
                e.currentTarget.classList.add('dragging-active');
                e.dataTransfer.setData('text/plain', currentQuestion.id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragEnd = (e) => {
                setIsDragging(false);
                setDragOverBinId(null);
                e.currentTarget.classList.remove('dragging-active');
            };

            const handleDragOver = (e, binId) => {
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move';
                if (dragOverBinId !== binId) {
                    setDragOverBinId(binId);
                }
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDragOverBinId(null);
            };

            const handleDrop = (e, binId) => {
                e.preventDefault();
                setIsDragging(false);
                setDragOverBinId(null);
                handleSort(binId); 
            };

            // --- MAIN LOGIC SORTING ---
            const handleSort = (binId) => {
                if (animatingItem) return; 
                
                setAnimatingItem(true);
                setLastUserAnswer(binId); 
                
                setTimeout(() => {
                    if (binId === currentQuestion.correctAnswer) {
                        setScore(prev => prev + 10);
                        setLevelScore(prev => prev + 10);
                        setLastAnswerStatus('CORRECT');
                    } else {
                        setLastAnswerStatus('INCORRECT');
                    }
                    setAnimatingItem(false);
                    setGameState('FEEDBACK');
                }, 400);
            };

            const handleNextAction = () => {
                if (currentQuestionIndex < 4) {
                    setCurrentQuestionIndex(prev => prev + 1);
                    setGameState('PLAYING');
                } else {
                    setGameState('LEVEL_COMPLETE');
                }
            };

            const handleReplayLevel = () => {
                setScore(prev => Math.max(0, prev - levelScore));
                setLevelScore(0);
                setCurrentQuestionIndex(0);
                setGameState('PLAYING');
            };

            const handleNextLevel = () => {
                if (currentLevelIndex >= activeSessionLevels.length - 1) {
                    setGameState('VICTORY');
                } else {
                    setLevelScore(0);
                    setCurrentLevelIndex(prev => prev + 1);
                    setCurrentQuestionIndex(0);
                    setGameState('PLAYING');
                }
            };

            const handleSaveScore = async (e) => {
                e.preventDefault();
                if (!playerName.trim()) return;
                
                setIsSubmitting(true);
                try {
                    await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        // Mengirim nama, profesi yang dipilih, dan skor
                        body: JSON.stringify({ name: playerName, profession: playerProfession, score: score })
                    });
                    setSubmitStatus('SUCCESS');
                } catch (error) {
                    console.error("Error submitting:", error);
                    setSubmitStatus('ERROR');
                }
                setIsSubmitting(false);
            };

            const handleShareWA = () => {
                const message = `Uji kepekaan Eco-Design kamu di *Bin It Right!* 🌍♻️\n\nSkor akhirku: ${score}/250.\n\nAda puluhan case kemasan yang siap mengecoh ide desainmu. Berani coba? Main sekarang di: ${window.location.href}`; 
                const encodedMessage = encodeURIComponent(message);
                window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');

                                    </div>

                                    {/* 2. REMINDER COPOUT POSITION & ENHANCED DENGAN VISUAL MEWAH */}
                                    <div className="bg-gradient-to-br from-emerald-600 to-teal-900 text-white p-10 md:p-14 rounded-[2.5rem] shadow-[0_25px_60px_rgba(5,150,105,0.35)] relative overflow-hidden mb-12 max-w-3xl mx-auto transform hover:scale-[1.02] transition-transform duration-300 text-left border-4 border-emerald-400/40">
                                        <div className="absolute -top-20 -right-20 w-72 h-64 bg-emerald-400 rounded-full blur-[90px] opacity-40 pointer-events-none"></div>
                                        <div className="absolute -bottom-20 -left-20 w-72 h-64 bg-teal-400 rounded-full blur-[90px] opacity-40 pointer-events-none"></div>
                                        
                                        <h3 className="font-black text-3xl md:text-5xl mb-8 text-emerald-100 tracking-tight flex items-center">
                                            <span className="text-6xl mr-4 drop-shadow-md">💡</span> Reminder buat Kamu!
                                        </h3>
                                        <p className="text-2xl md:text-3xl leading-relaxed font-black opacity-95 relative z-10 text-slate-50">
                                            "Sekitar <span className="text-yellow-300 text-4xl md:text-5xl font-black drop-shadow-[0_4px_6px_rgba(0,0,0,0.4)] mx-1">80%</span> dampak lingkungan dari sebuah produk ditentukan di tangan desainer pas lagi mikirin konsep. 
                                            <br/><br/>
                                            Jadilah desainer yang <span className="text-yellow-300 border-b-4 border-yellow-300 pb-1">mindful</span>. Bikin kemasan yang nggak cuma cantik pas di-unbox, tapi juga mati dengan anggun (sirkular) pas dibuang."
                                        </p>
                                    </div>

                                    {/* 3. KESIMPULAN GEN-Z & 5 KATEGORI SAMPAH */}
                                    <div className="text-left bg-white rounded-[2rem] p-6 md:p-10 border-2 border-slate-200 mb-10 shadow-sm max-w-4xl mx-auto">
                                        <h2 className="text-2xl sm:text-3xl font-black text-slate-800 mb-6 flex items-center tracking-tight">
                                            <span className="text-4xl mr-3">☕</span> Spill the Tea: Realita Pabrik Sampah
                                        </h2>

                                        <div className="space-y-4 sm:space-y-5">
                                            <div className="flex flex-col sm:flex-row bg-emerald-50/50 p-5 rounded-2xl border-2 border-emerald-100">
                                                <span className="text-4xl mb-2 sm:mb-0 sm:mr-5">🍃</span>
                                                <div>
                                                    <h3 className="font-black text-emerald-800 text-xl mb-1 uppercase tracking-wide">Tong Hijau (Organik)</h3>
                                                    <p className="text-base text-slate-600 leading-relaxed font-medium">Berasal dari alam dan bakal balik ke alam. Daun, sisa makanan, dan kayu tanpa pelitur. <b>Material murni yang bisa jadi kompos penyubur tanah.</b></p>
                                                </div>
                                            </div>
                                            <div className="flex flex-col sm:flex-row bg-blue-50/50 p-5 rounded-2xl border-2 border-blue-100">
                                                <span className="text-4xl mb-2 sm:mb-0 sm:mr-5">📄</span>
                                                <div>
                                                    <h3 className="font-black text-blue-800 text-xl mb-1 uppercase tracking-wide">Tong Biru (Kertas)</h3>
                                                    <p className="text-base text-slate-600 leading-relaxed font-medium">Sirkular abis. Tapi <b>pantangan terbesarnya: Laminasi glossy/plastik</b>. Kertas kalau udah dilaminasi bakal di-reject pabrik karena nggak bisa lebur jadi bubur pulp.</p>
                                                </div>
                                            </div>
                                            <div className="flex flex-col sm:flex-row bg-yellow-50/50 p-5 rounded-2xl border-2 border-yellow-100">
                                                <span className="text-4xl mb-2 sm:mb-0 sm:mr-5">♻️</span>
                                                <div>
                                                    <h3 className="font-black text-yellow-800 text-xl mb-1 uppercase tracking-wide">Tong Kuning (Anorganik)</h3>
                                                    <p className="text-base text-slate-600 leading-relaxed font-medium">Harta karunnya kang loak. Botol PET bening, kaca polos, aluminium murni. <b>Kuncinya: Monomaterial (cuma 1 jenis bahan) dan gampang dicuci.</b></p>
                                                </div>
                                            </div>
                                            <div className="flex flex-col sm:flex-row bg-red-50/50 p-5 rounded-2xl border-2 border-red-100">
                                                <span className="text-4xl mb-2 sm:mb-0 sm:mr-5">☠️</span>
                                                <div>
                                                    <h3 className="font-black text-red-800 text-xl mb-1 uppercase tracking-wide">Tong Merah (B3)</h3>
                                                    <p className="text-base text-slate-600 leading-relaxed font-medium">Red flag zone. Kaleng aerosol bertekanan, sisa aseton/alkohol, atau bahan kimia keras. Wajib pisah tong biar <b>nggak meledak atau ngeracunin tanah.</b></p>
                                                </div>
                                            </div>
                                            <div className="flex flex-col sm:flex-row bg-slate-100/50 p-5 rounded-2xl border-2 border-slate-200">
                                                <span className="text-4xl mb-2 sm:mb-0 sm:mr-5">🗑️</span>
                                                <div>
                                                    <h3 className="font-black text-slate-700 text-xl mb-1 uppercase tracking-wide">Tong Abu-abu (Residu)</h3>
                                                    <p className="text-base text-slate-600 leading-relaxed font-medium">Toxic trait industri: <b>Sachet & Multilayer</b>. Ukurannya terlalu kecil buat disortir mesin, atau plastiknya kecampur logam jadi mustahil dipisah. Fix numpuk di laut selamanya.</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-col md:flex-row justify-center gap-4 mt-10 max-w-3xl mx-auto">
                                        <button onClick={startGame} className="w-full md:w-1/3 py-5 bg-slate-800 text-white font-black text-lg rounded-2xl shadow-[0_8px_0_rgb(51,65,85)] hover:shadow-[0_4px_0_rgb(51,65,85)] hover:translate-y-1 transition-all">
                                            Main Ulang 🔄
                                        </button>
                                        <button onClick={handleShareWA} className="w-full md:w-1/3 py-5 bg-emerald-500 text-white font-black text-lg rounded-2xl shadow-[0_8px_0_rgb(5,150,105)] hover:shadow-[0_4px_0_rgb(5,150,105)] hover:translate-y-1 transition-all flex items-center justify-center space-x-2">
                                            <span className="text-2xl">💬</span>
                                            <span>Share ke WA</span>
                                        </button>
                                        <button onClick={backToStart} className="w-full md:w-1/3 py-5 bg-indigo-100 text-indigo-800 border-2 border-indigo-300 font-black text-lg rounded-2xl hover:bg-indigo-200 transition-all flex items-center justify-center space-x-2">
                                            <span className="text-xl">🏠</span>
                                            <span>Kembali ke Awal</span>
                                        </button>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
